hero:
  badge: Available for new projects
  headline: I take software projects from idea to shipped.
  lede: Project manager and AI product owner with 5+ years across SaaS, AI, and
    government software. Clients bring me in to shape a new product or platform
    into a real roadmap, to get a slipping timeline back on track, or when a
    build needs someone who can talk to engineers and stakeholders in the same
    sentence.
  cta_primary: Book an intro call
  cta_secondary: See how I work
metrics:
  - number: 20+
    label: products delivered end-to-end
  - number: 100%
    label: on-time release record
  - number: ~30%
    label: faster delivery after process fixes
  - number: 6+ yrs
    label: SaaS, AI & gov software
services_intro:
  title: What I handle for you
  text: From shaping a brand-new product to rescuing one that's stuck four ways I
    work with teams. Pick one, or start with a conversation and we'll scope it
    together.
services:
  - icon: roadmap
    title: Product strategy & roadmap
    text: Have an idea for a product or platform but no clear path to build it? I
      turn the vision into a concrete roadmap — scoping the MVP, sequencing
      releases, and translating 'we want to build X' into a plan your engineers
      can actually execute.
    points:
      - Product vision to roadmap
      - MVP scoping & release planning
      - Feasibility & estimate sanity-checks
  - icon: delivery
    title: End-to-end project delivery
    text: I own scope, timeline, budget, and risk from kickoff to release, so your
      engineering team builds and your stakeholders stay aligned instead of
      surprised.
    points:
      - Requirements workshops & specs
      - Sprint planning & backlog
      - Cross-functional team leadership
  - icon: ai
    title: AI & ML product ownership
    text: I define what "good" looks like for an AI feature, prioritize the backlog
      around it, and keep it grounded in what's actually shippable — not just
      what's demo-able.
    points:
      - AI/ML & IoT feature roadmapping
      - Backlog & acceptance criteria
      - Bridging data teams & stakeholders
  - icon: rescue
    title: Fix a slipping project
    text: Bring me in when a project is behind or the process is the problem. I find
      where time is leaking and put governance in place that sticks.
    points:
      - Workflow & process audit
      - RAID / risk management
      - Status reporting that stakeholders trust
process:
  - title: Intro call
    text: 30 minutes — what you're building, where it's stuck, what "done" looks
      like.
  - title: Scope & plan
    text: I come back with a delivery plan or a diagnosis of what's slipping and why.
  - title: Embed & run
    text: I work with your team directly — Jira, standups, stakeholder reporting,
      the real thing.
  - title: Ship & hand off
    text: Release, then a clean handoff with documentation so it doesn't depend on
      me forever.
cases:
  - sector: Enterprise & government clients
    client: Aviation, public-sector & cultural institutions
    headline: 15+ initiatives delivered on time and on budget
    text: SaaS platforms, mobile apps, and government portals — directing teams of
      5–10 across engineering, design, and QA, from requirements workshop
      through release.
  - sector: Construction-tech SaaS
    client: Construction-tech / manufacturing SaaS
    headline: AI & IoT features shipped into a live manufacturing product
    text: Owned the product cycle end to end, shipping two releases plus a
      manufacturing dashboard, and led integration of machine-connectivity
      features for real-time, data-driven decisions.
  - sector: Product & delivery org
    client: Multi-product software & delivery team
    headline: 100% of release deadlines met across 5+ products
    text: Ran Agile ceremonies for teams of 10+, cut delivery slippage by ~20%, and
      defined technical requirements for AI/ML data-analysis features.
testimonials: []
about:
  title: Why clients value my technical expertise.
  paragraphs:
    - I started as a developer building REST APIs and backend services in NodeJS
      and Django, which shaped my approach to project management. I can read
      sprint boards, evaluate architectural trade-offs, and realistically assess
      timelines rather than simply relay engineering estimates.
    - I hold a certification in McKinsey structured problem-solving and a degree
      in Management Information Systems. I've worked hybrid and remote with
      distributed teams, and I'm comfortable being the one stakeholder-facing
      person a client's project depends on.
  tags:
    - Agile / Scrum / Hybrid
    - Jira · Microsoft Project
    - SQL · Firebase · REST APIs
    - JavaScript / React · Python
    - English · Arabic
contact:
  title: Have a project that needs a plan?
  text: Tell me what you're building and where it's stuck. I'll reply within a day.
