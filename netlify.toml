[build]
  publish = "_site"
  command = "jekyll build"

[build.environment]
  JEKYLL_ENV = "production"

# ------------------------------------------------------------------
# Security headers — applied to every response.
# ------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cross-Origin-Opener-Policy = "same-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://identity.netlify.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.web3forms.com https://identity.netlify.com; frame-src https://identity.netlify.com; form-action 'self' https://api.web3forms.com; base-uri 'self'; object-src 'none'; frame-ancestors 'none'"

# ------------------------------------------------------------------
# The CMS admin (Decap) needs a looser policy to run. It is gated
# behind Netlify Identity login and marked noindex, so this is scoped
# only to /admin and overrides the strict policy above for that path.
# ------------------------------------------------------------------
[[headers]]
  for = "/admin/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self' 'unsafe-inline' 'unsafe-eval' https: data: blob:; frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    X-Robots-Tag = "noindex"

# Long cache for static assets (CSS/JS/fonts/images)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
