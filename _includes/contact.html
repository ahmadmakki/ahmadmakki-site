<section class="block soft" id="contact">
  <div class="wrap contact">
    <div>
      <h2>{{ site.data.content.contact.title }}</h2>
      <p class="sub">{{ site.data.content.contact.text }}</p>
      <div class="direct">
        Prefer email?<br>
        <a href="mailto:{{ site.email }}">{{ site.email }}</a><br>
        <a href="{{ site.linkedin }}" target="_blank" rel="noopener">Connect on LinkedIn</a>
      </div>
    </div>

    <div class="form-card">
      <form id="contact-form" data-email="{{ site.email }}">
        <input type="hidden" name="access_key" value="{{ site.web3forms_key }}">
        <input type="hidden" name="subject" value="New enquiry from your website">
        <input type="checkbox" name="botcheck" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">

        <div class="field">
          <label for="cf-name">Your name</label>
          <input type="text" id="cf-name" name="name" required placeholder="Jane Doe">
        </div>
        <div class="field">
          <label for="cf-email">Email</label>
          <input type="email" id="cf-email" name="email" required placeholder="jane@company.com">
        </div>
        <div class="field">
          <label for="cf-type">What do you need?</label>
          <select id="cf-type" name="enquiry_type">
            <option>End-to-end project delivery</option>
            <option>AI &amp; ML product ownership</option>
            <option>Fix a slipping project</option>
            <option>Something else</option>
          </select>
        </div>
        <div class="field">
          <label for="cf-msg">What are you building, and where is it stuck?</label>
          <textarea id="cf-msg" name="message" required placeholder="A few sentences is plenty."></textarea>
        </div>
        <button type="submit" class="btn-primary">Send message</button>
        <div class="form-status" id="form-status" role="status" aria-live="polite"></div>
      </form>
    </div>
  </div>
</section>

<script src="{{ '/assets/js/contact.js' | relative_url }}" defer></script>
