<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% if page.title %}{{ page.title }} — {{ site.author }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

<nav class="top">
  <div class="wrap">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.author }}</a>
    <div class="links">
      <a href="{{ '/#services' | relative_url }}">Services</a>
      <a href="{{ '/#work' | relative_url }}">Work</a>
      <a href="{{ '/blog/' | relative_url }}">Blog</a>
      <a href="{{ '/#about' | relative_url }}">About</a>
    </div>
    <a class="cta" href="{{ '/#contact' | relative_url }}">Work with me</a>
  </div>
</nav>

{{ content }}

<footer>
  <div class="wrap foot">
    <div>{{ site.author }} — Project Manager &amp; AI Product Owner</div>
    <div>
      <a href="{{ site.linkedin }}" target="_blank" rel="noopener">LinkedIn</a>
      &nbsp;·&nbsp;
      <a href="mailto:{{ site.email }}">Email</a>
      &nbsp;·&nbsp; {{ site.location }}
    </div>
  </div>
</footer>

</body>
</html>
