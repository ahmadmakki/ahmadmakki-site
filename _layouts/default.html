<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
{% seo %}
<link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
<link rel="icon" type="image/svg+xml" href="{{ '/assets/img/favicon.svg' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}">
<meta name="theme-color" content="#1B3A6B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<nav class="top">
  <div class="wrap">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img class="brand-logo" src="{{ '/assets/img/logo.svg' | relative_url }}" alt="{{ site.author }} logo" width="32" height="32">
      {{ site.author }}<span class="dot">.</span>
    </a>
    <div class="links">
      <a href="{{ '/#services' | relative_url }}">Services</a>
      <a href="{{ '/#work' | relative_url }}">Work</a>
      <a href="{{ '/blog/' | relative_url }}">Blog</a>
      <a href="{{ '/#about' | relative_url }}">About</a>
    </div>
    <a class="cta" href="{{ '/#contact' | relative_url }}">Start a project</a>
  </div>
</nav>

<main id="main">
{{ content }}
</main>

<footer>
  <div class="wrap foot">
    <div>© {{ 'now' | date: "%Y" }} {{ site.author }} — Project Manager &amp; AI Product Owner</div>
    <div>
      <a href="{{ site.linkedin }}" target="_blank" rel="noopener">LinkedIn</a>
      &nbsp;·&nbsp;
      <a href="mailto:{{ site.email }}">Email</a>
      {% if site.location %}&nbsp;·&nbsp; {{ site.location }}{% endif %}
    </div>
  </div>
</footer>

<script src="{{ '/assets/js/identity-redirect.js' | relative_url }}" defer></script>
<script src="{{ '/assets/js/reveal.js' | relative_url }}" defer></script>

</body>
</html>
